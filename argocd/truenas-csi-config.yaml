apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: truenas-csi-config
  namespace: argocd
spec:
  destination:
    namespace: truenas-csi
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/truenas-csi-config
    repoURL: https://github.com/NPastorale/kubernetes
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
