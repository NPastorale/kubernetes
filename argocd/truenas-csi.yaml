apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: truenas-csi
  namespace: argocd
spec:
  destination:
    namespace: truenas-csi
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: truenas-csi
    helm:
      valuesObject:
        metrics:
          enabled: true
        storageClasses:
          - allowVolumeExpansion: true
            isDefault: false
            mountOptions: []
            name: truenas-nfs
            parameters:
              compression: LZ4
              datasetPath: test
              protocol: nfs
            reclaimPolicy: Delete
            volumeBindingMode: Immediate
          - allowVolumeExpansion: true
            isDefault: false
            mountOptions: []
            name: truenas-nvmeof
            parameters:
              compression: LZ4
              datasetPath: test
              protocol: nvmeof
            reclaimPolicy: Delete
            volumeBindingMode: Immediate
        truenas:
          defaultPool: NAS-T
          existingSecret: truenas-csi-api-key
          existingSecretKey: api-key
          # NVMe-oF portal must be an IP: TrueNAS validates addr_traddr as IPvAnyAddress.
          nvmeofPortal: 10.10.20.10:4420
          url: wss://k8s.nas-t.nahue.ar
    repoURL: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts
    targetRevision: 1.4.0
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
