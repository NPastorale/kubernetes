apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: valkey
  namespace: argocd
spec:
  destination:
    namespace: gitlab
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: valkey
    helm:
      valuesObject:
        auth:
          aclUsers:
            default:
              permissions: ~* &* +@all
          enabled: true
          usersExistingSecret: valkey-auth
        dataStorage:
          enabled: false
        fullnameOverride: valkey
    repoURL: ghcr.io/valkey-io/valkey-helm
    targetRevision: 0.12.1
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
