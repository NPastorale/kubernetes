apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: gitlab
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: valkey
    repoURL: https://valkey.io/valkey-helm/
    targetRevision: 0.11.0
    helm:
      valuesObject:
        fullnameOverride: valkey
        dataStorage:
          enabled: false
        auth:
          enabled: true
          usersExistingSecret: valkey-auth
          aclUsers:
            default:
              permissions: "~* &* +@all"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
