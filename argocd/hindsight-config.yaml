apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hindsight-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: hindsight
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/hindsight
    repoURL: https://github.com/NPastorale/kubernetes
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
