apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: cert-manager
  namespace: argocd
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cert-manager
    helm:
      valuesObject:
        config:
          featureGates:
            ACMEUseARI: true
        crds:
          enabled: true
        dns01RecursiveNameservers: 10.10.20.50:53
        dns01RecursiveNameserversOnly: true
        global:
          revisionHistoryLimit: 0
    repoURL: quay.io/jetstack/charts
    targetRevision: v1.21.3
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
