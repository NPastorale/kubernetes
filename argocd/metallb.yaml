apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: metallb
  namespace: argocd
spec:
  destination:
    namespace: metallb-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: metallb
    helm:
      valuesObject:
        controller:
          revisionHistoryLimit: 0
        frrk8s:
          enabled: false
        speaker:
          revisionHistoryLimit: 0
    repoURL: quay.io/metallb/chart
    targetRevision: 0.16.2
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
