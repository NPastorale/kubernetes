apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hindsight
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: hindsight
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: hindsight
    helm:
      valuesObject:
        existingSecret: hindsight-db
        api:
          env:
            HINDSIGHT_API_LLM_PROVIDER: lmstudio
            HINDSIGHT_API_LLM_MODEL: qwen3.8-9b
            HINDSIGHT_API_LLM_BASE_URL: http://10.10.10.13:1234/v1
            HINDSIGHT_API_LLM_MAX_CONCURRENT: "2"
            HINDSIGHT_API_LLM_REASONING_EFFORT: "high"
            HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: "high"
            HINDSIGHT_API_REFLECT_LLM_REASONING_EFFORT: "high"
            HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: "high"
            HINDSIGHT_API_LLM_EXTRA_BODY: '{"think": true}'
            HINDSIGHT_API_REFLECT_MAX_ITERATIONS: "20"
            HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "600"
            HINDSIGHT_API_LLM_1_PROVIDER: openai-codex
            HINDSIGHT_API_LLM_1_MODEL: gpt-5.4-mini
            HINDSIGHT_API_LLM_STRATEGY: '{"mode": "failover"}'
            CODEX_HOME: /home/hindsight/.codex
          extraVolumes:
            - name: codex-auth
              persistentVolumeClaim:
                claimName: hindsight-codex-auth
          extraVolumeMounts:
            - name: codex-auth
              mountPath: /home/hindsight/.codex
        postgresql:
          enabled: false
          external:
            host: hindsight-rw.hindsight.svc.cluster.local
            port: 5432
            database: hindsight
            username: hindsight
        ingress:
          enabled: true
          className: internal-nginx
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-classic-prod"
          hosts:
            - host: hindsight.nahue.ar
              paths:
                - path: /
                  pathType: Prefix
                  service: controlPlane
          tls:
            - secretName: hindsight-tls
              hosts:
                - hindsight.nahue.ar
    repoURL: oci://ghcr.io/vectorize-io/charts/hindsight
    targetRevision: 0.9.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
