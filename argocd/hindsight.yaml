apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: hindsight
  namespace: argocd
spec:
  destination:
    namespace: hindsight
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: hindsight
    helm:
      valuesObject:
        api:
          env:
            HINDSIGHT_API_LLM_MODEL: gpt-6-luna
            HINDSIGHT_API_LLM_PROVIDER: openai-codex
            HINDSIGHT_API_LLM_REASONING_EFFORT: low
          extraVolumeMounts:
            - mountPath: /home/hindsight/.codex
              name: codex-auth
          extraVolumes:
            - name: codex-auth
              persistentVolumeClaim:
                claimName: hindsight-codex-auth
        existingSecret: hindsight-secrets
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-classic-prod
          className: internal-nginx
          enabled: true
          hosts:
            - host: hindsight.nahue.ar
              paths:
                - path: /
                  pathType: Prefix
                  service: controlPlane
          tls:
            - hosts:
                - hindsight.nahue.ar
              secretName: hindsight-tls
        postgresql:
          enabled: false
          external:
            database: hindsight
            host: hindsight-rw.hindsight.svc.cluster.local
            port: 5432
            username: hindsight
    repoURL: ghcr.io/vectorize-io/charts
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
