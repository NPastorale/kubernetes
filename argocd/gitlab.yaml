apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: gitlab
  namespace: argocd
spec:
  destination:
    namespace: gitlab
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: gitlab
    helm:
      valuesObject:
        gitlab:
          gitaly:
            gpgSigning:
              enabled: true
              key: signing_key
              secret: gitaly-gpg-signing-key
            persistence:
              size: 500Gi
              storageClass: nfs-csi-persistent
          gitlab-pages:
            ingress:
              tls:
                secretName: pages-tls
            resources:
              requests:
                cpu: 100m
          gitlab-shell:
            maxReplicas: 1
            minReplicas: 1
          sidekiq:
            extraInitContainers: |
              - name: init-public-key-sidekiq
                image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
                command: ['sh', '-c', 'echo "$PUBLIC_KEY" > /mnt/public.key']
                env:
                  - name: PUBLIC_KEY
                    value: |
                      -----BEGIN PUBLIC KEY-----
                      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAreEfP/ncA1A5cuxBz7rS
                      0Z9DDxdSymLwt2OUSM5WJa+dVB3zSpQjinifdNZq+iHVt8toZBZZ02H3unbn8td0
                      rIifoj4oVpLhvnOAVjUn5tZeUX17tWMA+yyBpf6w6IFxeYBXFd14WOKEarS05U9B
                      59DjBxNqSm+GzhljHO7vvTKy2xXQQ7Fa702DZ7jwr4DJnL87bDXfarnYksuawqtK
                      wQbFHAOvxFj8ghBh1Gshap1abExD4l7QWxFMTCVOkLJmXiqfOi5KuMiaMsSUsCBN
                      QDE3A5aKvpwLGozsvpGRMy5Tt4SgHC7ZbgerBNe75olOoPDxZf7bBt0+O5A/UjK/
                      HwIDAQAB
                      -----END PUBLIC KEY-----
                volumeMounts:
                  - name: public-key
                    mountPath: /mnt
            extraVolumeMounts: |
              - name: public-key
                mountPath: /srv/gitlab/.license_encryption_key.pub
                subPath: public.key
            extraVolumes: |
              - name: public-key
                emptyDir: {}
            maxReplicas: 1
            minReplicas: 1
            resources:
              requests:
                cpu: 100m
          toolbox:
            backups:
              cron:
                enabled: true
              objectStorage:
                config:
                  secret: backup-storage
            extraEnvFrom:
              COMPRESS_CMD:
                configMapKeyRef:
                  key: COMPRESS_CMD
                  name: gitlab-backup-compression
          webservice:
            extraInitContainers: |
              - name: init-public-key-webservice
                image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
                command: ['sh', '-c', 'echo "$PUBLIC_KEY" > /mnt/public.key']
                env:
                  - name: PUBLIC_KEY
                    value: |
                      -----BEGIN PUBLIC KEY-----
                      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAreEfP/ncA1A5cuxBz7rS
                      0Z9DDxdSymLwt2OUSM5WJa+dVB3zSpQjinifdNZq+iHVt8toZBZZ02H3unbn8td0
                      rIifoj4oVpLhvnOAVjUn5tZeUX17tWMA+yyBpf6w6IFxeYBXFd14WOKEarS05U9B
                      59DjBxNqSm+GzhljHO7vvTKy2xXQQ7Fa702DZ7jwr4DJnL87bDXfarnYksuawqtK
                      wQbFHAOvxFj8ghBh1Gshap1abExD4l7QWxFMTCVOkLJmXiqfOi5KuMiaMsSUsCBN
                      QDE3A5aKvpwLGozsvpGRMy5Tt4SgHC7ZbgerBNe75olOoPDxZf7bBt0+O5A/UjK/
                      HwIDAQAB
                      -----END PUBLIC KEY-----
                volumeMounts:
                  - name: public-key
                    mountPath: /mnt
            extraVolumeMounts: |
              - name: public-key
                mountPath: /srv/gitlab/.license_encryption_key.pub
                subPath: public.key
            extraVolumes: |
              - name: public-key
                emptyDir: {}
            ingress:
              tls:
                secretName: gitlab-tls
            maxReplicas: 5
            minReplicas: 2
            resources:
              requests:
                cpu: 100m
        gitlab-runner:
          checkInterval: 3
          gitlabUrl: https://gitlab.nahue.ar
          install: true
          podAnnotations:
            gitlab.com/prometheus_port: 9252
            gitlab.com/prometheus_scrape: "true"
          rbac:
            create: true
          revisionHistoryLimit: "0"
          runners:
            cache:
              secretName: gitlab-runner-cache-s3
            config: |
              [[runners]]
              url = "https://gitlab.nahue.ar"
              clone_url = "https://gitlab.nahue.ar"
                [runners.kubernetes]
                privileged = true
                image = "alpine:latest"
                [runners.cache]
                Type = "s3"
                Path = "runner"
                Shared = true
                  [runners.cache.s3]
                  ServerAddress = "10.10.20.10:30188"
                  BucketName = "runner-cache"
                  BucketLocation = "garage"
                  Insecure = true
                  AuthenticationType = "access-key"
            locked: false
        global:
          appConfig:
            defaultColorMode: 3
            defaultSyntaxHighlightingTheme: 5
            defaultTheme: 2
            object_store:
              connection:
                secret: object-storage
              enabled: true
            terraformState:
              enabled: true
          edition: ee
          gatewayApi:
            configureCertmanager: false
            enabled: false
            installEnvoy: false
          hosts:
            domain: nahue.ar
            https: true
          ingress:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-short-lived-prod
            class: internal-nginx
            configureCertmanager: false
            enabled: true
          kas:
            enabled: false
          pages:
            enabled: true
            objectStore:
              connection:
                secret: pages-storage
          psql:
            database: app
            host: postgres-gitlab-rw
            password:
              key: password
              secret: postgres-gitlab-app
            username: app
          redis:
            auth:
              enabled: true
              key: default
              secret: valkey-auth
            host: valkey
          revisionHistoryLimit: 0
          time_zone: Europe/Madrid
        installCertmanager: false
        nginx-ingress:
          enabled: false
        prometheus:
          install: false
        registry:
          hpa:
            maxReplicas: 1
            minReplicas: 1
          ingress:
            tls:
              secretName: registry-tls
          storage:
            secret: registry-storage
        upgradeCheck:
          enabled: false
    repoURL: registry.gitlab.com/charts/charts.gitlab.io/release
    targetRevision: 10.5.1
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
