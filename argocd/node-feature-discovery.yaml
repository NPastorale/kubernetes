apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: node-feature-discovery
  namespace: argocd
spec:
  destination:
    namespace: node-feature-discovery
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: node-feature-discovery
    helm:
      valuesObject:
        postDeleteCleanup: false
        worker:
          tolerations:
            - effect: NoSchedule
              key: nvidia.com/gpu
              operator: Equal
    repoURL: registry.k8s.io/nfd/charts
    targetRevision: 0.20.0
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
