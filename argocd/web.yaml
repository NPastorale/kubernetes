apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: web
  namespace: argocd
spec:
  destination:
    namespace: web
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: app
    helm:
      valuesObject:
        image: npastorale/web:0.0.1@sha256:947730477b653c32225c3ea82859bbccd2f5f53483bed5e06b84f9970a951ffd
        ports:
          http: 8080
        readiness:
          initialDelaySeconds: 3
          path: /
          periodSeconds: 3
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 56Mi
        route:
          gateway: external
          hostnames:
            - nahue.ar
            - www.nahue.ar
        type: Deployment
    repoURL: ghcr.io/npastorale/charts
    targetRevision: 0.1.0
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
