apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: argo-cd
    helm:
      valuesObject:
        configs:
          cm:
            oidc.config: |
              name: Authelia
              issuer: https://auth.nahue.ar
              clientID: argocd
              clientSecret: $argocd-authelia-oidc:clientSecret
              requestedScopes: ["openid", "profile", "email", "groups"]
              requestedIDTokenClaims: {"groups": {"essential": true}}
              enablePKCEAuthentication: true
            resource.customizations.health.deviceplugin.intel.com_GpuDevicePlugin:
              |
              hs = {}
              if obj.status == nil or obj.status.desiredNumberScheduled == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for the device plugin to report status"
                return hs
              end

              local ready = obj.status.numberReady or 0
              local desired = obj.status.desiredNumberScheduled

              if desired == 0 then
                hs.status = "Healthy"
                hs.message = "No node requires the device plugin"
              elseif ready >= desired then
                hs.status = "Healthy"
                hs.message = ready .. "/" .. desired .. " nodes ready"
              else
                hs.status = "Progressing"
                hs.message = ready .. "/" .. desired .. " nodes ready"
              end

              return hs

            resource.customizations.health.gateway.nginx.org_NginxGateway: |
              hs = {}
              if obj.status == nil or obj.status.conditions == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for the NginxGateway status"
                return hs
              end

              for _, c in ipairs(obj.status.conditions) do
                if c.type == "Valid" then
                  if c.status == "True" then
                    hs.status = "Healthy"
                  else
                    hs.status = "Degraded"
                  end
                  hs.message = c.message or c.reason or c.type
                  return hs
                end
              end

              hs.status = "Progressing"
              hs.message = "Waiting for the Valid condition"
              return hs

            resource.customizations.health.mongodbcommunity.mongodb.com_MongoDBCommunity:
              |
              hs = {}
              if obj.status == nil or obj.status.phase == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for the operator to report status"
                return hs
              end

              if obj.status.phase == "Running" then
                hs.status = "Healthy"
              elseif obj.status.phase == "Failed" then
                hs.status = "Degraded"
              else
                hs.status = "Progressing"
              end

              if obj.status.message ~= nil and obj.status.message ~= "" then
                hs.message = obj.status.message
              else
                hs.message = "Phase: " .. obj.status.phase
              end

              return hs

            resource.customizations.health.tailscale.com_Connector: |
              hs = {}
              if obj.status == nil or obj.status.conditions == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for the connector status"
                return hs
              end

              for _, c in ipairs(obj.status.conditions) do
                if c.type == "ConnectorReady" then
                  if c.status == "True" then
                    hs.status = "Healthy"
                  else
                    hs.status = "Degraded"
                  end
                  hs.message = c.message or c.reason or c.type
                  return hs
                end
              end

              hs.status = "Progressing"
              hs.message = "Waiting for the ConnectorReady condition"
              return hs
          params:
            server.insecure: true
          rbac:
            policy.csv: |
              g, admins, role:admin
            policy.default: role:readonly
        controller:
          revisionHistoryLimit: 0
        dex:
          enabled: false
        extraObjects:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: ListenerSet
            metadata:
              name: argocd-server-webhook
            spec:
              listeners:
                - allowedRoutes:
                    namespaces:
                      from: Same
                  hostname: argocd.nahue.ar
                  name: https
                  port: 443
                  protocol: HTTPS
                  tls:
                    certificateRefs:
                      - group: ""
                        kind: Secret
                        name: argocd-server-tls
                    mode: Terminate
              parentRef:
                name: external
                namespace: nginx-fabric
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              annotations:
                external-dns.alpha.kubernetes.io/exclude: "true"
              name: argocd-server-webhook
            spec:
              hostnames:
                - argocd.nahue.ar
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: argocd-server-webhook
                  sectionName: https
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: argocd-server
                      port: 80
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /api/webhook
        global:
          domain: argocd.nahue.ar
          revisionHistoryLimit: 0
        server:
          certificate:
            enabled: true
            issuer:
              group: cert-manager.io
              kind: ClusterIssuer
              name: letsencrypt-short-lived-prod
            privateKey:
              algorithm: ECDSA
              encoding: PKCS8
              rotationPolicy: Always
              size: 384
            usages:
              - server auth
          httproute:
            enabled: true
          listenerset:
            enabled: true
            parentRef:
              name: internal
              namespace: nginx-fabric
          service:
            servicePortHttp2: 8080
            servicePortHttp2AppProtocol: kubernetes.io/h2c
    repoURL: ghcr.io/argoproj/argo-helm
    targetRevision: 10.18.0
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
