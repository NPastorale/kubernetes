apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: argo-cd
    helm:
      valuesObject:
        configs:
          cm:
            oidc.config: |
              name: Authelia
              issuer: https://auth.nahue.ar
              clientID: argocd
              clientSecret: $argocd-authelia-oidc:clientSecret
              requestedScopes: ["openid", "profile", "email", "groups"]
              requestedIDTokenClaims: {"groups": {"essential": true}}
              enablePKCEAuthentication: true
          params:
            server.insecure: true
          rbac:
            policy.csv: |
              g, admins, role:admin
            policy.default: role:readonly
        controller:
          revisionHistoryLimit: 0
        dex:
          enabled: false
        extraObjects:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: ListenerSet
            metadata:
              name: argocd-server-webhook
            spec:
              listeners:
                - allowedRoutes:
                    namespaces:
                      from: Same
                  hostname: argocd.nahue.ar
                  name: https
                  port: 443
                  protocol: HTTPS
                  tls:
                    certificateRefs:
                      - group: ""
                        kind: Secret
                        name: argocd-server-tls
                    mode: Terminate
              parentRef:
                name: external
                namespace: nginx-fabric
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              annotations:
                external-dns.alpha.kubernetes.io/exclude: "true"
              name: argocd-server-webhook
            spec:
              hostnames:
                - argocd.nahue.ar
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: argocd-server-webhook
                  sectionName: https
              rules:
                - backendRefs:
                    - group: ""
                      kind: Service
                      name: argocd-server
                      port: 80
                      weight: 1
                  matches:
                    - path:
                        type: PathPrefix
                        value: /api/webhook
        global:
          domain: argocd.nahue.ar
          revisionHistoryLimit: 0
        server:
          certificate:
            enabled: true
            issuer:
              group: cert-manager.io
              kind: ClusterIssuer
              name: letsencrypt-short-lived-prod
            privateKey:
              algorithm: ECDSA
              encoding: PKCS8
              rotationPolicy: Always
              size: 384
            usages:
              - server auth
          httproute:
            enabled: true
          listenerset:
            enabled: true
            parentRef:
              name: internal
              namespace: nginx-fabric
          service:
            servicePortHttp2: 8080
            servicePortHttp2AppProtocol: kubernetes.io/h2c
    repoURL: ghcr.io/argoproj/argo-helm
    targetRevision: 10.11.0
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
