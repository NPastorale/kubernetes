apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: vault
  namespace: argocd
spec:
  destination:
    namespace: vault
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: vault
    helm:
      valuesObject:
        global:
          tlsDisable: false
        injector:
          enabled: false
        server:
          dataStorage:
            storageClass: nfs-csi-persistent
          httproute:
            enabled: true
            hostnames:
              - vault.nahue.ar
            matches:
              - path:
                  type: PathPrefix
                  value: /
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                name: vault-https
                namespace: vault
                sectionName: https
          standalone:
            config: |
              ui = true
              disable_mlock = true
              api_addr = "https://vault.nahue.ar"
              cluster_addr = "https://vault.nahue.ar:8201"
              listener "tcp" {
                address = "[::]:8200"
                tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
                tls_key_file  = "/vault/userconfig/vault-tls/tls.key"
              }
              storage "raft" {
                path = "/vault/data"
              }
              seal "gcpckms" {
                credentials = "/vault/userconfig/gcpkms-auth/sa-credentials.json"
                project     = "vault-kms-b3cfae84"
                region      = "europe-southwest1"
                key_ring    = "vault"
                crypto_key  = "vault-auto-unseal"
              }
            enabled: true
          updateStrategyType: RollingUpdate
          volumeMounts:
            - mountPath: /vault/userconfig/vault-tls/
              name: vault-tls
              readOnly: true
            - mountPath: /vault/userconfig/gcpkms-auth/
              name: gcpkms-auth
              readOnly: true
          volumes:
            - name: vault-tls
              secret:
                defaultMode: 400
                secretName: vault-selfsigned
            - name: gcpkms-auth
              secret:
                defaultMode: 400
                secretName: gcpkms-auth
        ui:
          enabled: false
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.34.1
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
