apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kube-prometheus-stack
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-prometheus-stack
    helm:
      valuesObject:
        grafana:
          grafana.ini:
            server:
              domain: grafana.nahue.ar
              root_url: https://grafana.nahue.ar
          revisionHistoryLimit: 0
          route:
            main:
              enabled: true
              filters:
                - extensionRef:
                    group: gateway.nginx.org
                    kind: SnippetsFilter
                    name: authelia-forward-auth
                  type: ExtensionRef
              hostnames:
                - grafana.nahue.ar
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: kube-prometheus-stack
                  namespace: monitoring
                  sectionName: grafana-https
        kube-state-metrics:
          revisionHistoryLimit: 0
        kubeEtcd:
          endpoints:
            - 10.10.20.31
        prometheus:
          prometheusSpec:
            retention: 30d
            retentionSize: 20GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 30Gi
                  storageClassName: nfs-csi-ephemeral
        prometheus-node-exporter:
          revisionHistoryLimit: 0
        prometheusOperator:
          revisionHistoryLimit: 0
    repoURL: ghcr.io/prometheus-community/charts
    targetRevision: 93.6.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
