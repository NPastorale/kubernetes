apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: authelia
  namespace: argocd
spec:
  destination:
    namespace: authelia
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: authelia
    helm:
      valuesObject:
        configMap:
          # Test only: one_factor lets you log in with just a password.
          # Change to two_factor once you have TOTP/WebAuthn enrolled.
          access_control:
            default_policy: one_factor
          authentication_backend:
            # Users file is mounted from a ConfigMap (read-only), so disable the
            # flows that would try to write it back.
            password_reset:
              disable: true
            password_change:
              disable: true
            file:
              enabled: true
              path: /users/users_database.yml
              watch: true
          notifier:
            filesystem:
              enabled: true
          session:
            cookies:
              - domain: nahue.ar
                subdomain: auth
          storage:
            local:
              enabled: true
          identity_providers:
            oidc:
              enabled: true
              claims_policies:
                argocd:
                  id_token:
                    - groups
                    # Argo CD builds the display username from "email" (falling
                    # back to "sub" = the UUID), so email must be in the ID token.
                    - email
              jwks:
                - algorithm: RS256
                  use: sig
                  key:
                    value: |
                      -----BEGIN PRIVATE KEY-----
                      MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDlOt9ABv4kocHR
