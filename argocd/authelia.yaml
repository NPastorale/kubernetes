apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: authelia
  namespace: argocd
spec:
  destination:
    namespace: authelia
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: authelia
    helm:
      valuesObject:
        configMap:
          access_control:
            default_policy: one_factor
          authentication_backend:
            file:
              enabled: true
              path: /users/users_database.yml
              watch: true
            password_change:
              disable: true
            password_reset:
              disable: true
          identity_providers:
            oidc:
              claims_policies:
                argocd:
                  id_token:
                    - groups
                    - email
              clients:
                - authorization_policy: one_factor
                  authorization_signed_response_alg: ES384
                  claims_policy: argocd
                  client_id: argocd
                  client_name: Argo CD
                  client_secret:
                    path: /secrets/oidc/client_secret
                  consent_mode: implicit
                  grant_types:
                    - authorization_code
                  id_token_signed_response_alg: ES384
                  pkce_challenge_method: S256
                  redirect_uris:
                    - https://argocd.nahue.ar/auth/callback
                  require_pkce: true
                  response_types:
                    - code
                  scopes:
                    - openid
                    - profile
                    - email
                    - groups
              enabled: true
              jwks:
                - algorithm: RS256
                  key:
                    path: /secrets/oidc/rsa.pem
                  use: sig
                - algorithm: ES384
                  key:
                    path: /secrets/oidc/ec.pem
                  use: sig
          notifier:
            filesystem:
              enabled: true
          session:
            cookies:
              - domain: nahue.ar
                subdomain: auth
          storage:
            local:
              enabled: true
          theme: dark
        extraObjects:
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: authelia
            spec:
              dnsNames:
                - auth.nahue.ar
              issuerRef:
                kind: ClusterIssuer
                name: letsencrypt-short-lived-prod
              privateKey:
                algorithm: ECDSA
                encoding: PKCS8
                rotationPolicy: Always
                size: 384
              secretName: authelia-tls
              usages:
                - server auth
          - apiVersion: gateway.networking.k8s.io/v1
            kind: ListenerSet
            metadata:
              name: authelia
            spec:
              listeners:
                - allowedRoutes:
                    namespaces:
                      from: Same
                  hostname: auth.nahue.ar
                  name: https
                  port: 443
                  protocol: HTTPS
                  tls:
                    certificateRefs:
                      - group: ""
                        kind: Secret
                        name: authelia-tls
                    mode: Terminate
              parentRef:
                name: internal
                namespace: nginx-fabric
        ingress:
          enabled: true
          gatewayAPI:
            enabled: true
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                name: authelia
                namespace: authelia
                sectionName: https
        pod:
          extraVolumeMounts:
            - mountPath: /config
              name: config-data
            - mountPath: /users
              name: users-database
              readOnly: true
          extraVolumes:
            - emptyDir: {}
              name: config-data
            - name: users-database
              secret:
                secretName: authelia-users
          kind: Deployment
          revisionHistoryLimit: 0
        secret:
          additionalSecrets:
            authelia-oidc:
              path: oidc
          existingSecret: authelia-secrets
    repoURL: ghcr.io/authelia/chartrepo
    targetRevision: 0.11.22
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
