                      k1ZtbTD0JJa+tn249+w8BPuS
                      -----END PRIVATE KEY-----
              clients:
                - client_id: argocd
                  client_name: Argo CD
                  # Hash of the plaintext secret configured in argocd.yaml
                  client_secret: "$pbkdf2-sha512$310000$5pfcEZELJ9ay7YT7DZjeBw$4SgLEItwqa1fkAIREWOLbDg3QyG0R2tHXSOYX.w.hnjgKKqt2Y9Mr7o4q90RR65Z9l0lLlllpd0zP00unuo5og"
                  redirect_uris:
                    - https://argocd.nahue.ar/auth/callback
                    - http://localhost:8085/auth/callback
                  scopes:
                    - openid
                    - profile
                    - email
                    - groups
                  grant_types:
                    - authorization_code
                  response_types:
                    - code
                  authorization_policy: one_factor
                  consent_mode: implicit
                  claims_policy: argocd
        ingress:
          enabled: true
          gatewayAPI:
            enabled: true
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                name: authelia
                namespace: authelia
                sectionName: https
        pod:
          kind: Deployment
          revisionHistoryLimit: 0
          extraVolumes:
            - name: config-data
              emptyDir: {}
            - name: users-database
              configMap:
                name: authelia-users
          extraVolumeMounts:
            - name: config-data
              mountPath: /config
            - name: users-database
              mountPath: /users
              readOnly: true
        extraObjects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: authelia-users
            data:
              users_database.yml: |
                users:
                  nahue:
                    disabled: false
                    displayname: Nahue
                    # authelia-test-2026
                    password: '$argon2id$v=19$m=65536,t=3,p=4$iTjuaPC4FhlOKDOzhtx5qg$zzSCk3xuVIR+XnVRkcGYb9Sf/Mt8lUx96Lu0yvjdJRw'
                    email: nahue@nahue.ar
                    groups:
                      - admins
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: authelia
            spec:
              secretName: authelia-tls
              issuerRef:
                name: letsencrypt-short-lived-prod
                kind: ClusterIssuer
              dnsNames:
                - auth.nahue.ar
          - apiVersion: gateway.networking.k8s.io/v1
            kind: ListenerSet
            metadata:
              name: authelia
            spec:
              parentRef:
                name: internal
                namespace: nginx-fabric
              listeners:
                - name: https
                  port: 443
                  protocol: HTTPS
                  hostname: auth.nahue.ar
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - group: ""
                        kind: Secret
                        name: authelia-tls
                  allowedRoutes:
                    namespaces:
                      from: Same
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.22
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
