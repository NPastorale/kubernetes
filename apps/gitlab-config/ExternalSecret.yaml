apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-storage
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: object-storage
    creationPolicy: Owner
    template:
      data:
        connection: |
          provider: AWS
          region: garage
          aws_access_key_id: {{ .accessKeyId }}
          aws_secret_access_key: {{ .secretAccessKey }}
          aws_signature_version: 4
          host: {{ .host }}
          endpoint: '{{ .endpoint }}'
          path_style: true
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: gitlab/garage
        property: access_key_id
    - secretKey: secretAccessKey
      remoteRef:
        key: gitlab/garage
        property: secret_access_key
    - secretKey: host
      remoteRef:
        key: gitlab/garage
        property: host
    - secretKey: endpoint
      remoteRef:
        key: gitlab/garage
        property: endpoint
---
