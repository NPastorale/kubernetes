apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
spec:
  data:
    - remoteRef:
        key: authelia
        property: reset_password_jwt_secret
      secretKey: identity_validation.reset_password.jwt.hmac.key
    - remoteRef:
        key: authelia
        property: session_encryption_key
      secretKey: session.encryption.key
    - remoteRef:
        key: authelia
        property: storage_encryption_key
      secretKey: storage.encryption.key
    - remoteRef:
        key: authelia
        property: oidc_hmac_secret
      secretKey: identity_providers.oidc.hmac.key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    creationPolicy: Owner
    name: authelia-secrets

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc
spec:
  data:
    - remoteRef:
        key: authelia
        property: oidc_client_secret
      secretKey: client_secret
    - remoteRef:
        key: authelia
        property: oidc_rsa_jwk_pem
      secretKey: rsa.pem
    - remoteRef:
        key: authelia
        property: oidc_ec_jwk_pem
      secretKey: ec.pem
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    creationPolicy: Owner
    name: authelia-oidc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
spec:
  data:
    - remoteRef:
        key: authelia
        property: users_database_yml
      secretKey: users_database.yml
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    creationPolicy: Owner
    name: authelia-users
