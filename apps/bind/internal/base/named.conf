controls {
        inet 127.0.0.1 allow { localhost; } keys { ddns-key; };
};

# ddns-confgen -a sha512
include "/etc/bind/ddns-key.conf";

options {
        directory "/var/bind";
        listen-on { any; };
        listen-on-v6 { none; };
        dnssec-validation no;
        allow-transfer { none; };
        pid-file "/var/run/named/named.pid";
        allow-query { any; };
        allow-recursion { none; };
        recursion no;
};

zone "nahue.ar" IN {
        type master;
        file "/etc/bind/master/nahue.ar.zone";
        update-policy {
            grant ddns-key zonesub ANY;
        };
};

zone "podvader.com" IN {
        type master;
        file "/etc/bind/master/podvader.com.zone";
        update-policy {
            grant ddns-key zonesub ANY;
        };
};

logging {
        channel stdout {
                stderr;
                severity info;
                print-category yes;
                print-severity yes;
                print-time yes;
        };
        category security { stdout; };
        category dnssec   { stdout; };
        category default  { stdout; };
        category queries  { stdout; };
        category update { stdout; };
        category update-security { stdout; };
        category notify { stdout; };
        category xfer-in { stdout; };
        category xfer-out { stdout; };
        category database { stdout; };
        category zoneload { stdout; };
};
