logging {
        channel stdout {
                stderr;
                severity info;
                print-category yes;
                print-severity yes;
                print-time yes;
        };

        category security {
                stdout;
        };

        category dnssec {
                stdout;
        };

        category default {
                stdout;
        };

        category queries {
                stdout;
        };

        category notify {
                stdout;
        };

        category xfer-in {
                stdout;
        };

        category xfer-out {
                stdout;
        };
};