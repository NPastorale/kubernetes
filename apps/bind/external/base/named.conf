controls {
        inet 127.0.0.1 allow { localhost; } keys { ddns-key; };
};

# ddns-confgen -a sha512
include "/etc/bind/ddns-key.conf";

options {
        directory "/var/bind";
        listen-on { any; };
        listen-on-v6 { none; };
        dnssec-validation auto;
        # allow-transfer {
        #         none;
        # };
        pid-file "/var/run/named/named.pid";
        allow-query { any; };
        allow-recursion { none; };
        recursion no;
};

zone "nahue.ar" IN {
        type master;
        file "/etc/bind/master/nahue.ar.zone";
        update-policy {
            grant ddns-key zonesub ANY;
        };
        allow-transfer { 69.65.50.192; };
        notify explicit;
        also-notify { 69.65.50.192; };
};

zone "nahue.eu" IN {
        type master;
