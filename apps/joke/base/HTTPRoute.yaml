apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: joke-https
spec:
  hostnames:
    - elverdaderorey.nahue.ar
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: joke-https
      namespace: joke
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: joke
          port: 80
          weight: 1
