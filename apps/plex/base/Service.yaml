apiVersion: v1
kind: Service
metadata:
  name: plex
spec:
  # Only the gateway (HTTPRoute) and in-cluster clients (Tautulli) need to
  # reach Plex; GDM discovery and the MetalLB VIP are gone with hostNetwork.
  ports:
    - name: web
      port: 32400
      protocol: TCP
      targetPort: 32400
  selector:
    app: plex
  type: ClusterIP
