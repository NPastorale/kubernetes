apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: plex
  name: plex
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: plex
  serviceName: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: gpu.intel.com/device-id.0300-46d1.present
                    operator: In
                    values:
                      - "true"
              weight: 100
            - preference:
                matchExpressions:
                  - key: gpu.intel.com/device-id.0300-3e9b.present
                    operator: In
                    values:
                      - "true"
              weight: 50
            - preference:
                matchExpressions:
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: In
                    values:
                      - "true"
              weight: 25
      automountServiceAccountToken: false
      containers:
        - env:
            - name: LSIO_NON_ROOT_USER
              value: "1"
            - name: S6_READ_ONLY_ROOT
              value: "1"
            - name: TZ
              value: Europe/Madrid
            - name: VERSION
              value: docker
          image: lscr.io/linuxserver/plex:1.43.5.11079-b3b13e506-ls332@sha256:d6e045dac4ea2ccb94e0aa4441e02dbec9c9d306d650814eb33d20ad497a2107
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /identity
              port: 32400
            periodSeconds: 10
          name: plex
          ports:
            - containerPort: 32400
              name: web
              protocol: TCP
            - containerPort: 8324
              name: companion
              protocol: TCP
            - containerPort: 32410
              protocol: UDP
            - containerPort: 32412
              protocol: UDP
            - containerPort: 32413
              protocol: UDP
            - containerPort: 32414
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            periodSeconds: 5
          resources:
            limits:
              gpu.intel.com/i915: 1
            requests:
              cpu: 100m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /identity
              port: 32400
            periodSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /run
              name: run
            - mountPath: /tmp
              name: tmp
            - mountPath: /persistent-data
              name: persistent-data
              readOnly: true
            - mountPath: /ephemeral-data
              name: ephemeral-data
              readOnly: true
            - mountPath: /config/Library/Application Support/Plex Media Server/Plug-in Support/Databases
              name: plex-database
        - args:
            - replicate
          image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
          name: litestream
          ports:
            - containerPort: 9090
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 911
            runAsNonRoot: true
            runAsUser: 911
          volumeMounts:
            - mountPath: /nfs
              name: config-db
            - mountPath: /data
              name: plex-database
            - mountPath: /etc/litestream.yml
              name: plex-litestream
              subPath: litestream.yaml
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      initContainers:
        - command:
            - sh
            - "-c"
            - chmod 0755 /run && chown 911:911 /run
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          name: fix-run
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /run
              name: run
        - args:
            - restore
            - "-if-db-not-exists"
            - "-if-replica-exists"
            - /data/com.plexapp.plugins.library.db
          image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
          name: init-litestream
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 911
            runAsNonRoot: true
            runAsUser: 911
          volumeMounts:
            - mountPath: /data
              name: plex-database
            - mountPath: /nfs
              name: config-db
              readOnly: true
            - mountPath: /etc/litestream.yml
              name: plex-litestream
              subPath: litestream.yaml
        - args:
            - restore
            - "-if-db-not-exists"
            - "-if-replica-exists"
            - /data/com.plexapp.plugins.library.blobs.db
          image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
          name: init-litestream-blobs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 911
            runAsNonRoot: true
            runAsUser: 911
          volumeMounts:
            - mountPath: /data
              name: plex-database
            - mountPath: /nfs
              name: config-db
              readOnly: true
            - mountPath: /etc/litestream.yml
              name: plex-litestream
              subPath: litestream.yaml
      securityContext:
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 911
        runAsNonRoot: true
        runAsUser: 911
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 44
          - 107
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          nfs:
            path: /mnt/NAS-T/k8s-volumes/persistent/plex/config
            server: 10.10.20.10
        - name: config-db
          nfs:
            path: /mnt/NAS-T/k8s-volumes/persistent/plex/databases
            server: 10.10.20.10
        - name: persistent-data
          nfs:
            path: /mnt/NAS-T/k8s-volumes/persistent/plex/data
            readOnly: true
            server: 10.10.20.10
        - name: ephemeral-data
          nfs:
            path: /mnt/NAS-T/k8s-volumes/ephemeral/plex/data
            readOnly: true
            server: 10.10.20.10
        - configMap:
            defaultMode: 444
            name: plex-litestream
          name: plex-litestream
        - emptyDir: {}
          name: plex-database
        - emptyDir: {}
          name: run
        - emptyDir: {}
          name: tmp
