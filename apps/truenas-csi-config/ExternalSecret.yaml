apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi-api-key
spec:
  data:
    - remoteRef:
        key: truenas
        property: api_key
      secretKey: api-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    creationPolicy: Owner
    name: truenas-csi-api-key
