apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsPolicy
metadata:
  name: external-hsts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  snippets:
    - context: http.server
      value: |
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
