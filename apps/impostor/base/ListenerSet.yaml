apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: impostor-https
spec:
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: impostor.nahue.ar
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: impostor-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: impostorvieja.nahue.ar
      name: https-vieja
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: impostor-tls
        mode: Terminate
  parentRef:
    name: external
    namespace: nginx-fabric
