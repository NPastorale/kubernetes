apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: impostor-tls
spec:
  dnsNames:
    - impostor.nahue.ar
    - impostorvieja.nahue.ar
  isCA: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-short-lived-prod
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  secretName: impostor-tls
  usages:
    - server auth
