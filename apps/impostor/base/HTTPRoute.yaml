apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: impostor-https
spec:
  hostnames:
    - impostor.nahue.ar
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: impostor-https
      namespace: impostor
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: impostor
          port: 80
          weight: 1
