apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
spec:
  dnsNames:
    - grafana.nahue.ar
  isCA: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-short-lived-prod
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  secretName: grafana-tls
  usages:
    - server auth
