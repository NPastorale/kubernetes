apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: grafana.nahue.ar
      name: grafana-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: grafana-tls
        mode: Terminate
  parentRef:
    name: internal
    namespace: nginx-fabric
