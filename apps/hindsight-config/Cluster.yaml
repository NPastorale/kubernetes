apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight
  namespace: hindsight
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie@sha256:0675340b02be838319b9b6f323c206693e519dcd62ec729d539be9f46bb7a2f9
  storage:
    size: 10Gi
    storageClass: truenas-nvmeof
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-db
  postgresql:
    shared_preload_libraries:
      - vector
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-202610190727-18-trixie@sha256:5e42ba35f8f1102cf8760dbb3db9352698257f12f757c089eb78740c50da944d
