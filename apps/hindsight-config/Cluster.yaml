apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight
  namespace: hindsight
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
  storage:
    size: 10Gi
    storageClass: truenas-nvmeof
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-db
  postgresql:
    shared_preload_libraries:
      - vector
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-202611122352-18-trixie@sha256:969f10190a34052c88492d5632ce3e49c042b59553ed363427235abdf93457d2
