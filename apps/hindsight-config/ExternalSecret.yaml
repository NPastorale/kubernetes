apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hindsight-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: hindsight
        password: "{{ .password }}"
        postgres-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hindsight
        property: postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-secrets
  namespace: hindsight
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hindsight-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: hindsight
        property: postgres_password
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef:
        key: hindsight
        property: opencode_go_api_key
