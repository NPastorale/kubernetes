apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: jellyfin
spec:
  parentRef:
    name: external
    namespace: nginx-fabric
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: jellyfin.nahue.ar
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: jellyfin-tls
      allowedRoutes:
        namespaces:
          from: Same
