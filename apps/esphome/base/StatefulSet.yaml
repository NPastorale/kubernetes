apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: esphome
  name: esphome
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: esphome
  serviceName: esphome
  template:
    metadata:
      labels:
        app: esphome
    spec:
      containers:
        - env:
            - name: TZ
              value: Europe/Madrid
          image: ghcr.io/esphome/esphome:2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f
          imagePullPolicy: IfNotPresent
          name: esphome
          ports:
            - containerPort: 6052
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: 100m
              memory: 56Mi
          volumeMounts:
            - mountPath: /config
              name: config
      hostNetwork: true
      volumes:
        - name: config
          nfs:
            path: /mnt/NAS-T/k8s-volumes/persistent/esphome/config
            server: 10.10.20.10
