apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: esphome
  name: esphome
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: esphome
  serviceName: esphome
  template:
    metadata:
      labels:
        app: esphome
    spec:
      containers:
        - env:
            - name: TZ
              value: Europe/Madrid
          image: >-
            ghcr.io/esphome/esphome:2026.9.1@sha256:776a845d508909bf426d2ee7bdd81796361ebe6a7f091807ce1d6d0b48985413
          imagePullPolicy: IfNotPresent
          name: esphome
          ports:
            - containerPort: 6052
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: 100m
              memory: 56Mi
          volumeMounts:
            - mountPath: /config
              name: config
      hostNetwork: true
      volumes:
        - name: config
          nfs:
            path: /mnt/NAS-T/k8s-volumes/persistent/esphome/config
            server: 10.10.20.10
