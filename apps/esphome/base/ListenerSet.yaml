apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: esphome-https
spec:
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: esphome.nahue.ar
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: esphome-tls
        mode: Terminate
  parentRef:
    name: internal
    namespace: nginx-fabric
