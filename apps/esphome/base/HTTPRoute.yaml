apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome-https
spec:
  hostnames:
    - esphome.nahue.ar
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: esphome-https
      namespace: esphome
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: esphome
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
