apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: slides-https
spec:
  parentRef:
    name: external
    namespace: nginx-fabric
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: slides.nahue.ar
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: slides-tls
      allowedRoutes:
        namespaces:
          from: Same
