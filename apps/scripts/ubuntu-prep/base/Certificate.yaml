apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ubuntu-prep-tls
spec:
  dnsNames:
    - ubuntu-prep.nahue.ar
  isCA: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-short-lived-prod
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  secretName: ubuntu-prep-tls
  usages:
    - server auth
