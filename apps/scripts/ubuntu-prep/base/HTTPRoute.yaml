apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ubuntu-prep-https
spec:
  hostnames:
    - ubuntu-prep.nahue.ar
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: ubuntu-prep-https
      namespace: scripts
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: ubuntu-prep
          port: 443
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replaceFullPath: /NPastorale/scripts/main/ubuntu-prep/ubuntu-prep.sh
              type: ReplaceFullPath
      matches:
        - path:
            type: PathPrefix
            value: /
