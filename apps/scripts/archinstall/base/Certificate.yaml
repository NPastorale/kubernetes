apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: archinstall-tls
spec:
  dnsNames:
    - archinstall.nahue.ar
  isCA: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-short-lived-prod
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  secretName: archinstall-tls
  usages:
    - server auth
