apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: archinstall-https
spec:
  hostnames:
    - archinstall.nahue.ar
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: archinstall-https
      namespace: scripts
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: archinstall
          port: 443
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replaceFullPath: /NPastorale/scripts/main/arch-installation/autoinstall.sh
              type: ReplaceFullPath
      matches:
        - path:
            type: PathPrefix
            value: /
